<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a10" />
    <meta name="description" content="Full-stack developer portfolio — an explorable, Minecraft-inspired 3D world with live GitHub projects and activity." />
    <meta property="og:title" content="Full-Stack Developer Portfolio" />
    <meta property="og:description" content="An explorable voxel world with real projects and GitHub activity." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('mc-portfolio:settings') || '{}')
        var t = s.theme === 'light' || s.theme === 'dark' ? s.theme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.documentElement.dataset.font = s.font === 'normal' ? 'normal' : 'pixel'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>Full-Stack Developer Portfolio</title>
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif; color: #f2eee7; background: #0b0a10">This portfolio needs JavaScript to load projects from GitHub.</div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
